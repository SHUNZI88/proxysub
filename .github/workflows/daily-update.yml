name: Daily Clean Clash Subscription

on:
  schedule:
    # 每 6 小时（北京时间 0/6/12/18）
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if script exists
        run: |
          ls -la
          test -f filter_clash.py && test -f sources.json && test -f requirements.txt

      - name: Run filter script (static cleaning only, no cloud probing)
        env:
          # 仅用于只读 GitHub 搜索（源发现）；sources_manager.py 内部已做限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYSUB_DISCOVERY: '1'
          # 显式禁用云端真实流量拨测：GitHub Actions（美西机房）无法穿越 GFW，
          # 物理上无法模拟中国大陆用户的真实连通性，测得的低延迟无参考价值。
          PROXYSUB_DISABLE_PROBE: '1'
        run: python filter_clash.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clean_clash.yaml survival.json source_stats.json bad_sources.json \
            sources.json candidate_sources.json honeypot_blocklist.json || true
          # remove accidental duplicate if still tracked
          if [ -f .github/workflows/filter_clash.py ]; then
            git rm -f .github/workflows/filter_clash.py || true
          fi

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Update subscription: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
