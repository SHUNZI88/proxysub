name: Daily Clean Clash Subscription

on:
  schedule:
    # 非整点触发，避开 GitHub 队列整点高峰造成的大幅延迟
    # （UTC 17 分 ≈ 北京时间 0:17 / 6:17 / 12:17 / 18:17）
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [external-trigger]   # 供外部 cron 心跳（cron-job.org 等）调用

permissions:
  contents: write
  issues: write                 # 失败时自动开 issue 告警

# 并发互斥：同一时刻只允许一个更新任务。注意这里刻意使用
# cancel-in-progress: false —— 更新任务运行上限 50 分钟，若为新触发的运行
# 而取消进行中的运行，会白白浪费已跑完的抓取/拨测并导致该时段无更新产出。
# （此前的定时失败正是并发竞态导致 push 被拒，见下方 rebase 重试。）
concurrency:
  group: proxysub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # 反爬：public 仓库的 workflow_dispatch 默认任何人可手动触发。限定仅仓库
    # 所有者可手动运行（schedule / repository_dispatch 不受影响——后者本就需要
    # 带 repo 权限的 PAT，天然受限）。
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 完整历史，push 前才能 rebase 到最新远端

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install mihomo (liveness gate)
        env:
          MIHOMO_VERSION: v1.19.32
        run: |
          set -euo pipefail
          VER="${MIHOMO_VERSION}"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors -o /tmp/mihomo.gz -L "$URL"; then
              ok=1; break
            fi
            echo "download attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: mihomo download failed after retries" >&2
            exit 1
          fi
          gunzip -c /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          # 校验解压产物确为可执行 ELF，防止下载到截断文件/错误页后带坏内核跑完全程
          if ! file /usr/local/bin/mihomo | grep -q ELF; then
            echo "ERROR: downloaded mihomo is not a valid ELF binary" >&2
            exit 1
          fi
          mihomo -v

      - name: Check if script exists
        run: |
          ls -la
          test -f filter_clash.py && test -f sources.json && test -f requirements.txt

      - name: Run filter script (liveness-gated static cleaning)
        env:
          MIHOMO_BIN: /usr/local/bin/mihomo
          # 仅用于只读 GitHub 搜索（源发现）；sources_manager.py 内部已做限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYSUB_DISCOVERY: '1'
          # 反爬总开关走 anti_crawl.json 的 enabled；此处可设 '0' 临时强制关闭
          PROXYSUB_ANTI_CRAWL: '1'
          # 调试用：PROXYSUB_DISABLE_PROBE=1 可跳过真实拨测（输出会混入僵尸节点）
        run: python filter_clash.py

      - name: Commit and Push (with rebase retry)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clean_clash.yaml clean_singbox.json clean_v2ray.txt \
                  clean_proxies_only.yaml stats.md survival.json \
                  source_stats.json source_scores.json bad_sources.json \
                  sources.json candidate_sources.json honeypot_blocklist.json \
                  collected_nodes.txt anti_crawl.json robots.txt || true
          # 反爬轮换文件名（clean_clash.<token>.yaml 等）：-A 同时捕获新增与
          # 被程序删除的过期文件；无匹配时静默跳过。
          git add -A -- 'clean_clash.*' 'clean_singbox.*' 'clean_v2ray.*' \
                  'clean_proxies_only.*' 2>/dev/null || true
          # remove accidental duplicate if still tracked
          if [ -f .github/workflows/filter_clash.py ]; then
            git rm -f .github/workflows/filter_clash.py || true
          fi

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update subscription: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push 前先 rebase 到最新远端（带重试），解决与并行运行的 non-fast-forward 冲突
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $i failed, retrying in $((i * 8))s..."
            sleep $((i * 8))
          done
          echo "最终推送失败" >&2
          exit 1

      - name: Publish rolling release (anti-crawl permanent URLs)
        # 反爬 release 模式：把 .publish/ 下的真实输出发布为滚动 Release（tag sub），
        # 资产名为随机字符串（首次生成后不变），订阅地址永久有效。
        # 未开启反爬或 publish_release=false 时跳过。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! python3 -c "
          import json, sys
          try:
              cfg = json.load(open('anti_crawl.json', encoding='utf-8'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if cfg.get('enabled') and cfg.get('publish_release', True) else 1)
          "; then
            echo "反爬 Release 发布未启用，跳过"
            exit 0
          fi
          tag="$(python3 -c "import json; print(json.load(open('anti_crawl.json', encoding='utf-8')).get('release_tag') or 'sub')")"
          compgen -G ".publish/*" >/dev/null || { echo "ERROR: .publish/ 下没有待发布文件" >&2; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber .publish/*
          else
            gh release create "$tag" --title "subscription" \
              --notes "Auto-updated rolling release. Permanent subscription URLs (random asset names) are shown only in the Actions run Step Summary (repo owner)." \
              .publish/*
          fi
          echo "已发布滚动 Release: $tag"

      - name: Create issue on failure
        # 反爬：失败详情默认不再开公开 Issue（会在仓库 Issues 页暴露运行信息），
        # 需要告警时把下方 ALERT_ISSUE 改为 '1'。
        if: failure() && env.ALERT_ISSUE == '1'
        env:
          ALERT_ISSUE: '0'
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Update failed: ${now}`;
            const body = [
              '本次更新任务失败，请检查日志。',
              '',
              `- 触发方式: \`${context.eventName}\``,
              `- 运行链接: ${runUrl}`,
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            } catch (e) {
              // label 不存在时不阻塞：不带 label 再建一次
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
