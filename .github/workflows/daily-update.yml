name: Daily Clean Clash Subscription

on:
  schedule:
    # 非整点触发，避开 GitHub 队列整点高峰造成的大幅延迟
    # （UTC 17 分 ≈ 北京时间 0:17 / 6:17 / 12:17 / 18:17）
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [external-trigger]   # 供外部 cron 心跳（cron-job.org 等）调用

# 安全评估 F5（CWE-250 最小权限）：GITHUB_TOKEN 权限只能在 job 级声明，
# 无法在 step 内临时提权，故按职责拆两个 job——
#   update：只读 contents（跑抓取/拨测/生成，含 sources_manager 的
#           GitHub 搜索 API——只需读）。绝不给写权限：本 job 会执行
#           大量外部可控输入（channels 抓取），一旦被 SSRF 等方式利用
#           泄漏 token，危害仅限读。
#   publish：contents:write + issues:write（Release 上传 / git push /
#            失败告警）。只处理本仓已生成的文件，不接触外部输入。
# 两 job 间经 actions artifact 传递输出（ upload → download ）。
permissions:
  contents: read

# 并发互斥：同一时刻只允许一个更新任务。注意这里刻意使用
# cancel-in-progress: false —— 更新任务运行上限 50 分钟，若为新触发的运行
# 而取消进行中的运行，会白白浪费已跑完的抓取/拨测并导致该时段无更新产出。
# （此前的定时失败正是并发竞态导致 push 被拒，见 publish job 的 rebase 重试。）
concurrency:
  group: proxysub-update
  cancel-in-progress: false

jobs:
  # ===================== 生成（只读权限） =====================
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # 反爬：public 仓库的 workflow_dispatch 默认任何人可手动触发。限定仅仓库
    # 所有者可手动运行（schedule / repository_dispatch 不受影响——后者本就需要
    # 带 repo 权限的 PAT，天然受限）。
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 完整历史，publish job push 前才能 rebase 到最新远端

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # 优先使用带 hash 的锁文件（可复现 + 完整性校验）；锁文件缺失时
        # 回退 requirements.txt（本地开发场景）。
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: Install mihomo (liveness gate)
        env:
          MIHOMO_VERSION: v1.19.32
          # 安全评估 F3（CWE-345）：上游 MetaCubeX/mihomo 的 Release 不发布
          # .sha256 校验文件，故此处 pin 已知完整包的 sha256 作为完整性基线
          # （基线取自官方 Release API 元数据 size=22846526 的完整资产）。
          # 升级 MIHOMO_VERSION 时必须同步更新本 hash，否则下载被拦截、
          # 工作流失败——这是有意的防呆：宁可失败也不用未校验二进制。
          MIHOMO_SHA256: 8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10
        run: |
          set -euo pipefail
          VER="${MIHOMO_VERSION}"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors -o /tmp/mihomo.gz -L "$URL"; then
              ok=1; break
            fi
            echo "download attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: mihomo download failed after retries" >&2
            exit 1
          fi
          # 完整性校验（F3）：先校验 gz 包 sha256，再解压。
          # 拦截：发布被投毒 / 下载被中间人篡改 / 截断的半包。
          echo "${MIHOMO_SHA256}  /tmp/mihomo.gz" | sha256sum -c -
          gunzip -c /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          # 解压产物二次确认：必须仍是可执行 ELF（防解压链路异常）
          if ! file /usr/local/bin/mihomo | grep -q ELF; then
            echo "ERROR: downloaded mihomo is not a valid ELF binary" >&2
            exit 1
          fi
          mihomo -v

      - name: Check if script exists
        run: |
          ls -la
          test -f filter_clash.py && test -f sources.json && test -f requirements.txt

      - name: Run filter script (liveness-gated static cleaning)
        env:
          MIHOMO_BIN: /usr/local/bin/mihomo
          # 仅用于只读 GitHub 搜索（源发现）；sources_manager.py 内部已做限流。
          # 本 job 的 permissions 仅 contents:read——token 泄漏也拿不到写能力。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYSUB_DISCOVERY: '1'
          # 反爬总开关走 anti_crawl.json 的 enabled；此处可设 '0' 临时强制关闭
          PROXYSUB_ANTI_CRAWL: '1'
          # 调试用：PROXYSUB_DISABLE_PROBE=1 可跳过真实拨测（输出会混入僵尸节点）
        run: python filter_clash.py

      - name: Stage outputs for artifact
        # upload-artifact@v4 的 glob 语义会跳过点开头的隐藏目录——.publish/
        # 直接写在 path 里不会被打包（2026-10-14 run 37 实测：.publish/ 整个
        # 丢失导致 publish job 无文件可发）。故先复制到非隐藏目录再上传。
        run: |
          set -euo pipefail
          rm -rf publish_out
          if [ -d .publish ]; then
            cp -r .publish publish_out
          else
            mkdir -p publish_out
          fi
          ls -la publish_out

      - name: Upload outputs for publish job
        # F5：生成物经 artifact 传给写权限 job。清单与 publish job 的
        # 「Commit and Push」逐文件 add 清单保持一致（含反爬轮换文件）。
        uses: actions/upload-artifact@v4
        with:
          name: update-outputs
          if-no-files-found: error
          retention-days: 1
          path: |
            publish_out/
            clean_clash.yaml
            clean_singbox.json
            clean_v2ray.txt
            clean_proxies_only.yaml
            stats.md
            survival.json
            source_stats.json
            source_scores.json
            bad_sources.json
            sources.json
            candidate_sources.json
            honeypot_blocklist.json
            collected_nodes.txt
            anti_crawl.json
            robots.txt
            cn_history.json
            learned_thresholds.json
            threshold_history.json
            probe_history.jsonl
            clean_clash.*
            clean_singbox.*
            clean_v2ray.*
            clean_proxies_only.*

  # ===================== 发布（写权限，不接触外部输入） =====================
  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # git push + Release 上传
      issues: write            # 失败时自动开 issue 告警
    # update 失败/取消时也进入本 job：第一个步骤会以非 0 退出，交由
    # 末尾「Create issue on failure」按原策略告警（默认 ALERT_ISSUE=0 关闭）。
    if: ${{ !cancelled() }}

    steps:
      - name: Check previous job result
        run: |
          if [ "${{ needs.update.result }}" != "success" ]; then
            echo "ERROR: update job 未成功（${{ needs.update.result }}），不进入发布" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 完整历史，push 前才能 rebase 到最新远端

      - name: Download outputs
        uses: actions/download-artifact@v4
        with:
          name: update-outputs
          path: .

      - name: Publish rolling release (anti-crawl permanent URLs)
        # 反爬 release 模式：把 publish_out/（update job 经 artifact 传来的
        # .publish/ 副本）下的真实输出发布为滚动 Release（tag sub），
        # 资产名为随机字符串（首次生成后不变），订阅地址永久有效。
        # 未开启反爬或 publish_release=false 时跳过。
        #
        # 步骤顺序：发布必须先于「Commit and Push」。发布失败（网络/gh 故障）时
        # 绝不能先提交——否则仓库状态文件（survival/source_scores）已前进而永久
        # 地址仍指向旧资产，下一轮将基于失同步状态选样，质量继续漂移。
        #
        # 上传顺序（隐式契约，勿改文件名破坏）：files 清单里 candidates_* 先于
        # pending_*（'can' < 'pen'），p_* 主资产在最前。沙箱实测定时任务以
        # pending_probe.json 的 generated_at 作新鲜度闸门——读到新文档时订阅
        # 内容必已就绪，不会拿到半成品。
        #
        # 主资产所有权切换：实测验证新鲜时主资产归沙箱实测集（CI 不覆盖），
        # 陈旧/缺失时 CI 兜底发布候选集到主资产。详见 run 内注释与 common.py
        # 的 VERIFICATION_* 阈值。
        #
        # 发布前 sanity 检查：待发布文件不得包含诱饵标记（bait_host/[BAIT]）
        # 且必须非空——2026-10 曾因运行成功但 glob 只捕获到固定名诱饵文件，
        # 险些让永久地址服务纯诱饵内容；此处作为最后一道闸门。另要求至少
        # 一个候选集副本在场，防止只发布 pending_*.json 而订阅内容缺失。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! python3 -c "
          import json, sys
          try:
              cfg = json.load(open('anti_crawl.json', encoding='utf-8'))
          except Exception:
              sys.exit(1)
          sys.exit(0 if cfg.get('enabled') and cfg.get('publish_release', True) else 1)
          "; then
            echo "反爬 Release 发布未启用，跳过"
            exit 0
          fi
          tag="$(python3 -c "import json; print(json.load(open('anti_crawl.json', encoding='utf-8')).get('release_tag') or 'sub')")"
          compgen -G "publish_out/*" >/dev/null || { echo "ERROR: publish_out/ 下没有待发布文件" >&2; exit 1; }
          # ---- 主资产所有权切换（CI 候选集 vs 沙箱实测集）----
          # 实测验证新鲜（report <12h 且通过数 ≥15，阈值见 common.py）时，
          # 主资产（p_* 随机名，订阅永久地址）归沙箱实测集所有：CI 只发布
          # 候选集固定名副本（candidates_*）与交接文档（pending_*），避免
          # 发布后即被下一轮 CI 覆盖的抖动，订阅者长时间拿到优选集。
          # 验证陈旧/缺失（沙箱连续未产出）时 CI 兜底：候选集发布到主资产，
          # 保证订阅永不枯竭。
          ver_fresh=0
          if gh release download "$tag" -p verification_report.json \
               -O /tmp/verification_report.json --clobber >/dev/null 2>&1 \
             && python3 scripts/verification_fresh.py /tmp/verification_report.json; then
            ver_fresh=1
          fi
          if [ "$ver_fresh" = "1" ]; then
            echo "实测验证新鲜：主资产归沙箱实测集，CI 仅发布候选集副本与交接文档"
          else
            echo "实测验证陈旧/缺失：CI 兜底发布候选集到主资产"
          fi
          # 上传清单：候选集副本 + 交接文档总是发布；主资产仅兜底时发布。
          files=()
          for f in publish_out/candidates_* publish_out/pending_*; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "$ver_fresh" != "1" ]; then
            for f in publish_out/p_*; do
              [ -f "$f" ] && files+=("$f")
            done
          fi
          [ "${#files[@]}" -ge 1 ] || { echo "ERROR: 没有可发布文件" >&2; exit 1; }
          # 订阅内容在场检查：至少一个候选集副本（防只有交接文档）
          n_sub=0
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              pending_probe.json|pending_rescue.json) ;;
              *) n_sub=$((n_sub + 1)) ;;
            esac
          done
          [ "$n_sub" -ge 1 ] || { echo "ERROR: 缺少订阅内容（候选集副本）" >&2; exit 1; }
          # 诱饵污染检查：真实输出绝不包含 bait_host / [BAIT] 标记
          bait_host="$(python3 -c "import json; print((json.load(open('anti_crawl.json', encoding='utf-8')).get('bait_host') or 'bait.invalid'))")"
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "ERROR: 待发布文件为空: $f" >&2; exit 1; }
            if grep -qF "$bait_host" "$f" || grep -qF "[BAIT]" "$f"; then
              echo "ERROR: 待发布文件疑似诱饵内容（含 $bait_host / [BAIT]）: $f" >&2
              exit 1
            fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${files[@]}"
          else
            gh release create "$tag" --title "subscription" \
              --notes "Auto-updated rolling release. Permanent subscription URLs (random asset names) are shown only in the Actions run Step Summary (repo owner)." \
              "${files[@]}"
          fi
          echo "已发布滚动 Release: $tag（主资产归属: $([ "$ver_fresh" = "1" ] && echo 实测集 || echo 候选集兜底)）"

      - name: Commit and Push (with rebase retry)
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 逐文件 add：任一文件缺失（如 collected_nodes.txt 未被生成）不影响其余文件。
          # 曾经的坑：整单 `git add a b c ... || true` 是原子操作，一个缺失路径使
          # 整个 add 失败被 || true 吞掉，导致 survival/source_scores 等状态文件
          # 连续多轮停更（排名历史与源管理状态冻结），节点质量随之下滑。
          for f in clean_clash.yaml clean_singbox.json clean_v2ray.txt \
                   clean_proxies_only.yaml stats.md survival.json \
                   source_stats.json source_scores.json bad_sources.json \
                   sources.json candidate_sources.json honeypot_blocklist.json \
                   collected_nodes.txt anti_crawl.json robots.txt \
                   cn_history.json learned_thresholds.json threshold_history.json \
                   probe_history.jsonl; do
            [ -f "$f" ] && git add "$f" || true
          done
          # 反爬轮换文件名（clean_clash.<token>.yaml 等）：-A 同时捕获新增与
          # 被程序删除的过期文件；无匹配时静默跳过。
          git add -A -- 'clean_clash.*' 'clean_singbox.*' 'clean_v2ray.*' \
                  'clean_proxies_only.*' 2>/dev/null || true
          # remove accidental duplicate if still tracked
          if [ -f .github/workflows/filter_clash.py ]; then
            git rm -f .github/workflows/filter_clash.py || true
          fi

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update subscription: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push 前先 rebase 到最新远端（带重试），解决与并行运行的 non-fast-forward 冲突
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $i failed, retrying in $((i * 8))s..."
            sleep $((i * 8))
          done
          echo "最终推送失败" >&2
          exit 1

      - name: Create issue on failure
        # 反爬：失败详情默认不再开公开 Issue（会在仓库 Issues 页暴露运行信息），
        # 需要告警时把下方 ALERT_ISSUE 改为 '1'。
        # 默认关闭时的维护者反馈通道：Watch 本仓库（Custom → 勾选 Actions）
        # 收失败邮件，或在 Actions 页订阅通知——详见 README「反馈与告警」。
        if: failure() && env.ALERT_ISSUE == '1'
        env:
          ALERT_ISSUE: '0'
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Update failed: run #${context.runNumber} (${context.eventName})`;
            const body = [
              '本次更新任务失败，请检查日志。失败详情不在此展开（反爬：不公开悬挂运行信息）。',
              '',
              `- 运行: #${context.runNumber}（尝试 ${context.runAttempt}）`,
              `- 触发方式: \`${context.eventName}\``,
              `- 提交: \`${String(context.sha).slice(0, 8)}\``,
              `- 时间: ${now}`,
              `- 日志: ${runUrl}`,
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            } catch (e) {
              // label 不存在时不阻塞：不带 label 再建一次
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
