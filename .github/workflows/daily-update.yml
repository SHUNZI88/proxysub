name: Daily Clean Clash Subscription

on:
  schedule:
    # 每 6 小时（北京时间 0/6/12/18）
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests pysocks

      - name: Install mihomo for real proxy probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIHOMO_FALLBACK_VER: v1.19.32
        run: |
          set -euo pipefail
          VER=""
          # Unauthenticated api.github.com often 403s on shared Actions IPs; use GITHUB_TOKEN.
          if RESP=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest); then
            VER=$(printf '%s' "$RESP" | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          else
            echo "GitHub API latest failed; using fallback ${MIHOMO_FALLBACK_VER}"
            VER="$MIHOMO_FALLBACK_VER"
          fi
          echo "mihomo version: $VER"
          ASSET="mihomo-linux-amd64-${VER}.gz"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/${ASSET}"
          # Public release assets: do not send Authorization (breaks CDN redirects).
          if ! curl -fsSL -o /tmp/mihomo.gz -L "$URL"; then
            echo "download ${ASSET} failed; retry fallback ${MIHOMO_FALLBACK_VER}"
            VER="$MIHOMO_FALLBACK_VER"
            ASSET="mihomo-linux-amd64-${VER}.gz"
            URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/${ASSET}"
            curl -fsSL -o /tmp/mihomo.gz -L "$URL"
          fi
          gunzip -c /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v
          echo "MIHOMO_BIN=/usr/local/bin/mihomo" >> "$GITHUB_ENV"

      - name: Check if script exists
        run: |
          ls -la
          test -f filter_clash.py && test -f sources.json

      - name: Run filter script
        env:
          MIHOMO_BIN: /usr/local/bin/mihomo
          # used only for read-only GitHub search (source discovery); rate limits respected in sources_manager.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYSUB_DISCOVERY: '1'
        run: python filter_clash.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clean_clash.yaml survival.json source_stats.json bad_sources.json \
            sources.json candidate_sources.json honeypot_blocklist.json || true
          # remove accidental duplicate if still tracked
          if [ -f .github/workflows/filter_clash.py ]; then
            git rm -f .github/workflows/filter_clash.py || true
          fi

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Update subscription: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
