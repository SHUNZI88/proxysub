name: Daily Clean Clash Subscription

on:
  schedule:
    # 每 6 小时（北京时间 0/6/12/18，UTC 16/22/4/10）
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 修订 1：并发互斥。
# 此前定时运行与手动 workflow_dispatch 运行可能同时进行：手动运行先 push 了
# 新提交，定时运行结束时仍基于旧 checkout 去 push，被 GitHub 以
# non-fast-forward 拒绝 → 定时运行在 "Commit and Push" 步骤失败、更新丢失。
# 加 concurrency 组让运行排队串行执行；再配合下方 push 前的 rebase 兜底。
concurrency:
  group: proxysub-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # 修订 2：完整历史，push 前才能 rebase 到最新远端

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install mihomo (liveness gate probe)
        env:
          # 固定版本，避免 latest 接口偶发失败；下载带重试
          MIHOMO_VERSION: v1.19.32
        run: |
          set -euo pipefail
          VER="${MIHOMO_VERSION}"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${VER}/mihomo-linux-amd64-${VER}.gz"
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors -o /tmp/mihomo.gz -L "$URL"; then
              ok=1; break
            fi
            echo "download attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: mihomo download failed after retries" >&2
            exit 1
          fi
          # 校验：确认解压产物是可执行的 ELF 二进制（防止下载到截断/HTML 错误页）
          gunzip -c /tmp/mihomo.gz > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          if ! file /usr/local/bin/mihomo | grep -q ELF; then
            echo "ERROR: downloaded mihomo is not a valid ELF binary" >&2
            exit 1
          fi
          mihomo -v

      - name: Check if script exists
        run: |
          ls -la
          test -f filter_clash.py && test -f sources.json && test -f requirements.txt

      - name: Run filter script (liveness-gated static cleaning)
        env:
          MIHOMO_BIN: /usr/local/bin/mihomo
          # 仅用于只读 GitHub 搜索（源发现）；sources_manager.py 内部已做限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROXYSUB_DISCOVERY: '1'
        run: python filter_clash.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clean_clash.yaml survival.json source_stats.json bad_sources.json \
            sources.json candidate_sources.json honeypot_blocklist.json || true
          # remove accidental duplicate if still tracked
          if [ -f .github/workflows/filter_clash.py ]; then
            git rm -f .github/workflows/filter_clash.py || true
          fi

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi

          git commit -m "Update subscription: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 修订 3：push 前先 rebase 到最新远端，带重试，彻底解决与并行运行的
          # non-fast-forward 冲突（此前 3 次定时失败中有 2 次因此丢失更新）
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              if git push origin main; then ok=1; break; fi
            fi
            echo "push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "ERROR: push failed after rebase retries" >&2
            exit 1
          fi
