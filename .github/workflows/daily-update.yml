name: Daily Clean Clash Subscription

on:
  schedule:
    - cron: '0 16 * * *'   # 每天北京时间 00:00
  workflow_dispatch:

permissions:
  contents: write          # 必须加这一行，否则 push 会失败

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Check if script exists
        run: |
          ls -la
          if [ ! -f filter_clash.py ]; then
            echo "❌ 错误：找不到 filter_clash.py 文件！"
            exit 1
          fi
          echo "✅ 找到 filter_clash.py"

      - name: Run filter script
        run: python filter_clash.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add clean_clash.yaml || true
          
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "Daily update: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
