name: Candidate pool refresh

# 职责：**只做抓源与初选**，不做任何「能不能用」的判断。
#
# 为什么单独一个工作流：
#   * 抓源必须发生在海外网络（runner 上 raw.githubusercontent 与各订阅源都是
#     一等公民），而「节点在我这里能不能用」必须发生在家宽。两者混在一台
#     机器上，会把「源连不上」误记成「源没内容」，源评估越评越窄。
#   * 免费节点寿命以小时计。daily-update 每 6 小时一轮，本机拿到的候选平均
#     已放凉 3~6 小时；这个工作流只做抓取+解析+去重，2 分钟内跑完，因此可以
#     高频刷新，让本机实测永远对着几十分钟内的新鲜名单。
#
# 产物：滚动 Release（tag: pool）里的固定资产名 pool.json / pool_stats.json。
# 本机实测脚本按龄期（POOL_MAX_AGE_H）判断是否可用，过旧自动降级自抓并告警。

on:
  schedule:
    # 每 20 分钟一次。GitHub 的计划任务可能延迟数分钟，但不影响用途：
    # 本机只要求池子「近」，不要求「准点」。
    - cron: '8,28,48 * * * *'
  workflow_dispatch:
  # 外部 cron 心跳（cron-job.org 等）可触发——GitHub 计划任务在同仓库高频
  # 工作流并存时常被推迟数十分钟，池子越旧本机产出率越低，需要一条可控通道。
  repository_dispatch:
    types: [pool-refresh]

permissions:
  contents: write     # 需要写 Release 资产

concurrency:
  group: proxysub-pool
  cancel-in-progress: true      # 池子是可再生产物，新轮次直接取代旧轮次

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build candidate pool
        env:
          PYTHONIOENCODING: utf-8
        # 体量即本机等待时间（实测到 GitHub 对象存储只有 10~30KB/s）。
        # 2026-11-20 实测配比：738 个测试集用完 712s / 1500s 预算，剩近一半；
        # 而 delay 初筛通过率只有 12%，**瓶颈是候选量而不是判据**——候选翻倍
        # 近似线性换产出，所以放宽到 120/源、2800 上限（gz ≈ 210KB ≈ 10~20s）。
        # 120/源 不影响高产出源（它们本来就只有十几到几十个节点），只截断
        # 「几百上千个节点、本机产出率 0~3%」的聚合器长尾；本机侧还有
        # pool_sample 按源产出率二次加权，不会把预算平摊给零产源。
        run: python scripts/pool_build.py --per-source 120 --max-pool 2800

      - name: Upload pool to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="pool"
          test -s pool.json.gz
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "candidate pool" \
              --notes "Auto-refreshed candidate pool (fetched + parsed + deduped on CI; NOT China-tested). Consumed by the local probe."
          fi
          # 只发布 gzip 版：本机到 GitHub 对象存储实测 23~30KB/s，
          # 1.68MB 原始 JSON 要 70~200s，gz 后 314KB / 约 14s。
          gh release upload "$tag" pool.json.gz pool_stats.json --clobber

          # 【关键】把 latest 标记让回订阅 tag。GitHub 的 releases/latest 按 release
          # 创建时间排序——本 job 新建/刷新 pool 会把 latest 从 sub 抢走，而客户端
          # 订阅地址形如 .../releases/latest/download/p_<token>_c.yaml，一旦 latest
          # 指向 pool 就会 404（2026-11-20 事故：pool 创建后订阅全量 404）。
          # daily-update 虽有同样的复位，但其 schedule 曾连续多轮不触发，不能单独依赖。
          # --clobber 只改资产不改创建时间，故仅首次 create 后需要复位；此处无条件
          # 复位为幂等保险，代价是一次 API 调用。
          sub_tag="$(python3 -c "import json; print(json.load(open('anti_crawl.json',encoding='utf-8')).get('release_tag') or 'sub')")"
          if gh release view "$sub_tag" >/dev/null 2>&1; then
            gh release edit "$sub_tag" --latest
            echo "已把 latest 标记复位到订阅 release: $sub_tag"
          fi

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("pool.json"):
              print("pool.json 未生成（构建失败）")
          else:
              doc = json.load(open("pool.json", encoding="utf-8"))
              src = doc.get("sources") or {}
              ok = [k for k, v in src.items() if v.get("ok")]
              print(f"### 候选池 {len(doc.get('nodes') or [])} 个节点 / {len(ok)}/{len(src)} 个源成功")
              print("")
              print("| 源 | 解析 | 保留 | 状态 |")
              print("|---|---|---|---|")
              for k, v in sorted(src.items(), key=lambda x: -int(x[1].get("kept") or 0)):
                  print(f"| `{k}` | {v.get('count',0)} | {v.get('kept',0)} | "
                        f"{'OK' if v.get('ok') else str(v.get('error'))[:40]} |")
          EOF
