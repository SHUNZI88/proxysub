name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency audit (pip-audit)
        # 安全评估 F2：依赖漏洞扫描，阻断含已知 CVE 的传递依赖合入。
        # pip-audit 的 advisory 源为 PyPA OSV 数据库（联网查询）。
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v
