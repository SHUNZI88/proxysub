name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'tests/**'
      - '.coveragerc'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# P2 并发互斥（与 daily-update 的 concurrency 同一思路，参数相反）：
# 按 workflow + ref 分组——同一分支的push / 同一 PR 的多次推送只保留最新一次
# 运行。测试仅 ~10 分钟且幂等，被新提交取代的旧跑结果已无意义，故
# cancel-in-progress: true（daily-update 用 false：那边跑 50 分钟且
# 取消会浪费已完成的抓取/拨测，产出会空档）。状态按 commit 归属，
# 取消旧跑不影响最新 commit 的门禁判定。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # 优先使用带 hash 的锁文件（F2：可复现 + 完整性校验），缺失时回退。
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock ]; then
            pip install --require-hashes -r requirements.lock
          else
            pip install -r requirements.txt
          fi

      - name: Dependency audit (pip-audit)
        # 安全评估 F2：依赖漏洞扫描，阻断含已知 CVE 的传递依赖合入。
        # pip-audit 的 advisory 源为 PyPA OSV 数据库（联网查询）。
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run unit tests with coverage gate
        # P1-1d：覆盖率门禁 ≥80%（阈值与 omit 范围见 .coveragerc）。
        # pytest-cov 已随 requirements.lock 安装；fail_under 未达标时
        # pytest-cov 以非零退出码阻断合入。
        run: python -m pytest tests/ -v --cov --cov-report=term-missing
