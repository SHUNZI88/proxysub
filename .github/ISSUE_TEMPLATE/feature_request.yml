name: 功能建议
description: 新格式输出 / 新源类型 / 机制改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 README「设计定位」——本仓库刻意**不做云端延迟排序**（GitHub Actions 机房在美国，无法预测中国大陆连通性），测速优选由本地客户端完成。与此边界冲突的建议大概率不被采纳。

  - type: dropdown
    id: area
    attributes:
      label: 建议领域
      options:
        - 订阅输出格式（新客户端格式）
        - 源发现与采集（新渠道类型）
        - 过滤与评分策略
        - 反爬与分发机制
        - 工程化（CI / 测试 / 可观测性）
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现状哪里不好？影响谁？（没有具体问题的「许愿」恕不跟进）
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为是什么？有无替代方案权衡？
    validations:
      required: true
