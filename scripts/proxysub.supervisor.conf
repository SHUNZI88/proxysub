; proxysub 中国出口实测 —— 平台原生 supervisord 托管配置
; 部署位置：/usr/local/share/supervisor/proxysub.conf
; （supervisord 主配置 include 该路径，沙箱每次唤醒自动加载）
; 作用：休眠唤醒后自动拉起 cron 与守护；守护启动即做资产龄期检查并补跑。
[program:proxysub-cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startsecs=3
priority=60
stdout_logfile=/tmp/cn_probe/supervisord-cron.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

[program:proxysub-guard]
command=/root/.codebuddy/artifact/proxysub/scripts/cron_supervisor.sh
autostart=true
autorestart=true
startsecs=2
priority=61
stdout_logfile=/tmp/cn_probe/supervisord-guard.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true

; 外部触发端点（2026-10-28）：公网可达，供 GitHub Actions 定时 curl
; /trigger 触发实测；沙箱活着时可立即生效，配合 supervisord 自启形成闭环。
[program:proxysub-trigger]
command=/root/.pyenv/shims/python3.11 -u /root/.codebuddy/artifact/proxysub/scripts/wake_trigger.py
environment=PROXYSUB_TRIGGER_TOKEN="proxysub",PROXYSUB_STALE_H="3",PROXYSUB_COOLDOWN_H="2",PROXYSUB_TRIGGER_PORT="8080"
autostart=true
autorestart=true
startsecs=3
priority=62
stdout_logfile=/tmp/cn_probe/supervisord-trigger.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
redirect_stderr=true
